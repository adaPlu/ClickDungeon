name: CI (placeholder for secrets injection)

on:
  push:
    branches: [ main ]

jobs:
  build-with-secrets:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      CLICKDUNGEON_KEYSTORE_BASE64: ${{ secrets.CLICKDUNGEON_KEYSTORE_BASE64 }}
      CLICKDUNGEON_STORE_PASSWORD: ${{ secrets.CLICKDUNGEON_STORE_PASSWORD }}
      CLICKDUNGEON_KEY_ALIAS: ${{ secrets.CLICKDUNGEON_KEY_ALIAS }}
      CLICKDUNGEON_KEY_PASSWORD: ${{ secrets.CLICKDUNGEON_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode and write google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "$GITHUB_WORKSPACE"
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Write Play service account
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > /tmp/play-service-account.json

      - name: Decode release keystore
        if: ${{ env.CLICKDUNGEON_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CLICKDUNGEON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clickdungeon-upload.jks"
          echo "CLICKDUNGEON_STORE_FILE=$RUNNER_TEMP/clickdungeon-upload.jks" >> "$GITHUB_ENV"

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build signed release bundle
        if: ${{ env.CLICKDUNGEON_KEYSTORE_BASE64 != '' && env.CLICKDUNGEON_STORE_PASSWORD != '' && env.CLICKDUNGEON_KEY_ALIAS != '' && env.CLICKDUNGEON_KEY_PASSWORD != '' }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/test-results/testDebugUnitTest

# Notes:
# - File secrets should be stored as base64-encoded values in GitHub secrets (example: base64 < google-services.json).
# - This workflow is a placeholder to show where CI would inject `google-services.json`, Play service keys, and release signing material.
# - Do NOT commit real secrets to the repository.
