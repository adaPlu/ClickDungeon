name: CI (placeholder for secrets injection)

on:
  push:
    branches: [ main ]

jobs:
  build-with-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode and write google-services.json
        if: secrets.GOOGLE_SERVICES_JSON != ''
        run: |
          echo "$GITHUB_WORKSPACE"
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Write Play service account
        if: secrets.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > /tmp/play-service-account.json
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/test-results/testDebugUnitTest

# Notes:
# - Secrets should be stored as base64-encoded values in GitHub secrets (example: base64 < google-services.json).
# - This workflow is a placeholder to show where CI would inject `google-services.json` and Play service keys.
# - Do NOT commit real secrets to the repository.
